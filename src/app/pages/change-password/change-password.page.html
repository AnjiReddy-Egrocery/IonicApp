<ion-header>
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-back-button 
        defaultHref="/home" 
        color="light"
        text=""
        icon="arrow-back-outline"
        style="margin-left: 14px;">
  </ion-back-button>
    </ion-buttons>
    <div class="custom-toolbar">
      <h1>స్వామి శరణం అయ్యప్ప</h1>
      <h2>(www.ayyappatelugu.com)</h2>
    </div>
  
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

   <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" style="margin-right: 10px; color: white;"></ion-icon>
            <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="currentPassword" [(ngModel)]="currentPassword" [ngModelOptions]="{standalone: true}"></ion-input>
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="end" (click)="toggleShowPassword()"></ion-icon>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" style="margin-right: 10px; color: white;"></ion-icon>
            <ion-input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="password" [(ngModel)]="password" [ngModelOptions]="{standalone: true}"></ion-input>
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'" slot="end" (click)="toggleShowConfirmPassword()"></ion-icon>
          </ion-item>


  <ion-button expand="block" color="danger" type="button" class="update-btn" (click)="submitChangePassword()">Update Password</ion-button>


</ion-content>
