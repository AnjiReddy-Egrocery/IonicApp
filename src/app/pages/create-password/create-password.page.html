<ion-content fullscreen class="login-page">
  <div class="login-container">

     <div class="card-wrapper">
        <div class="profile-image">
        <ion-img src="../../../assets/ic_launcher.png"></ion-img>
      </div>

      <div class="header-card">
        <h1 class="title" style="margin-top: 50px;">Reset Password</h1>
      </div>

      <div class="login-card">  
       <!-- Password -->
        <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start" style="margin-right: 10px;"></ion-icon>
          <ion-input  [type]="showPassword ? 'text' : 'password'"
              placeholder="Password"
              [(ngModel)]="password" [ngModelOptions]="{standalone: true}"></ion-input>
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              slot="end"
              (click)="togglePassword()">></ion-icon>
        </ion-item>

         <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start" style="margin-right: 10px;"></ion-icon>
          <ion-input  [type]="showPassword ? 'text' : 'password'"
              placeholder="Confirm Password"
              [(ngModel)]="Confirmpassword" [ngModelOptions]="{standalone: true}"></ion-input>
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              slot="end"
              (click)="togglePassword()">></ion-icon>
        </ion-item>

        <!-- Login Button -->
        <ion-button expand="block" color="danger"  type="button" class="login-btn" (click)="goToResetPassword()">
          Reset Password
        </ion-button>

       
      </div>
     </div>  
  </div>
</ion-content>
