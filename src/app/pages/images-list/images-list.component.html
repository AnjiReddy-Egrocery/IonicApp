<ion-header>
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <div class="custom-toolbar">
      <h1>స్వామి శరణం అయ్యప్ప</h1>
      <h2>(www.ayyappatelugu.com)</h2>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="container">
    <div class="header-container">
      <span class="header-title">అయ్యప్ప పోస్టర్లు</span>
      <img src="../../../assets/nearby.png" class="header-icon">
    </div>

    <ion-refresher slot="fixed" (ionRefresh)="getImages($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <ion-card  #posterCard class="poster-card" *ngFor="let item of images; let i = index" >
      <swiper-container slides-per-view="1" pagination="true" auto-height="true" observer="true" observe-parents="true">
        
        <swiper-slide>
          <div class="capture-area" [id]="'poster-' + i">
            <div class="poster-wrapper" >
              <img class="poster-image" [src]="baseUrl + item.image">
              <div class="floating-buttons">
                <ion-button fill="solid" shape="round" color="light" (click)="sharePoster(i)">
                  <ion-icon name="share-social-outline"></ion-icon>
                </ion-button>
                <ion-button fill="solid" shape="round" color="light" (click)="downloadPoster(i)">
                  <ion-icon name="download-outline"></ion-icon>
                </ion-button>
              </div>
            </div>
            <div class="bottom-section">
              <div class="user-details">
                <ng-container *ngIf="hasFlyerData(); else uploadBtn">
                  <h2>{{userName}}</h2>
                  <p>{{userRole}}</p>
                </ng-container>
                <ng-template #uploadBtn>
                  <ion-button class="upload-btn" color="warning" (click)="goToUploadDetails()">Upload Details Here</ion-button>
                </ng-template>
              </div>
              <div class="profile-circle" *ngIf="hasFlyerData()">
                <img [src]="profileImage" class="profile-image">
              </div>
            </div>
          </div>
        </swiper-slide>

        </swiper-container>
    </ion-card>
  </div>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more posters..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<ion-footer
  slot="fixed"
  class="custom-footer">

  <ion-toolbar class="custom-footer-toolbar">

    <ion-grid>

      <ion-row
        class="ion-align-items-center ion-justify-content-center">

        <ion-col
          size="auto"
          (click)="goToAnadanam()">

          <div class="icon-text-row">

            <ion-img
              src="../../../assets/location.png"
              class="bottom-icon">
            </ion-img>

            <p class="bottom-text">
              అన్నదానం
            </p>

          </div>

        </ion-col>

        <ion-col
          class="ion-text-center"
          size="2.4">

          <ion-img
            src="../../../assets/bottomcenter.png"
            class="bottom-icon">
          </ion-img>

        </ion-col>

        <ion-col
          size="auto"
          (click)="goToNityaPooja()">

          <div class="text-image-row">

            <p class="bottom-text">
              నిత్య పూజ
            </p>

            <ion-img
              src="../../../assets/nithyapooja.png"
              class="bottom-icon">
            </ion-img>

          </div>

        </ion-col>

      </ion-row>

    </ion-grid>

  </ion-toolbar>

</ion-footer>
