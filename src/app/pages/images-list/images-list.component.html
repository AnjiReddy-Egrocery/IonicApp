<ion-header>
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
     <ion-back-button 
        defaultHref="/home" 
        color="light"
        text=""
        icon="arrow-back-outline"
        style="margin-left: 14px;">
  </ion-back-button>
    </ion-buttons>
    <div class="custom-toolbar">
      <h1>స్వామి శరణం అయ్యప్ప</h1>
      <h2>(www.ayyappatelugu.com)</h2>
    </div>
 
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="container">
 <div class="header-container">
    <span class="header-title"> అయ్యప్ప పోస్టర్లు</span>
    <img src="../../../assets/nearby.png" class="header-icon" />
  </div>

   

 <ion-refresher
    slot="fixed"
    (ionRefresh)="getImages($event)">

    <ion-refresher-content>
    </ion-refresher-content>

  </ion-refresher>

<ion-card
  *ngFor="let item of images; let i = index"
  class="poster-card"
  >
<div
  class="capture-area"
  #posterCard>
  <div class="poster-wrapper">

    <!-- Main Poster -->
    <img
      [src]="baseUrl + item.image"
      class="poster-image"
    />

    <!-- Share Download -->
    <div class="floating-buttons">

         <ion-button
              fill="solid"
              shape="round"
              color="light"
              (click)="sharePoster(i)">

              <ion-icon
                slot="icon-only"
                name="share-social-outline">
              </ion-icon>

            </ion-button>

            <ion-button
          fill="solid"
          shape="round"
          color="light"
          (click)="downloadPoster(i)">

          <ion-icon
            slot="icon-only"
            name="download-outline">
          </ion-icon>

        </ion-button>

    </div>

  </div>

  <!-- Slide 1 Bottom Design -->

  <div class="bottom-section">

    <div class="orange-line top-line"></div>

    <div class="user-details">

      <ng-container *ngIf="hasFlyerData(); else uploadBtn">

        <h2>{{ userName }}</h2>

        <p>{{ userRole }}</p>

      </ng-container>

      <ng-template #uploadBtn>

        <ion-button
          color="warning"
           class="upload-btn"
          (click)="goToUploadDetails()"
        >
          Upload Details Here
        </ion-button>

      </ng-template>

    </div>

    <!-- Profile Image -->

    <div
      class="profile-circle"
      *ngIf="hasFlyerData()"
    >
      <img
      crossorigin="anonymous"
        [src]="profileImage"
      />
    </div>

    <div class="orange-line bottom-line"></div>

  </div>
 </div>
</ion-card>
  </div>
 <!-- Infinite Scroll Start -->
<ion-infinite-scroll
  threshold="100px"
  (ionInfinite)="loadMore($event)">

  <ion-infinite-scroll-content
    loadingSpinner="bubbles"
    loadingText="Loading more posters...">
  </ion-infinite-scroll-content>

</ion-infinite-scroll>
<!-- Infinite Scroll End -->



</ion-content>

<ion-footer slot="fixed" class="custom-footer">
    <ion-toolbar class="custom-footer-toolbar">
      <ion-grid>
        <ion-row class="ion-align-items-center ion-justify-content-center">

          <!-- First Item: Icon + Text -->
          <ion-col size="auto" (click)="goToAnadanam()">
            <div class="icon-text-row">
              <ion-img src="../../../assets/location.png" class="bottom-icon"></ion-img>
              <p class="bottom-text">అన్నదానం</p>
            </div>
          </ion-col>

          <!-- Center Icon -->
          <ion-col class="ion-text-center" size="2.4">
            <ion-img src="../../../assets/bottomcenter.png" class="bottom-icon"></ion-img>
          </ion-col>

          <!-- Fifth Item: Text + Icon -->
          <ion-col size="auto" (click)="goToNityaPooja()">
            <div class="text-image-row">
              <p class="bottom-text">నిత్య పూజ</p>
              <ion-img src="../../../assets/nithyapooja.png" class="bottom-icon"></ion-img>
            </div>
          </ion-col>

        </ion-row>
      </ion-grid>
    </ion-toolbar>
  </ion-footer>
