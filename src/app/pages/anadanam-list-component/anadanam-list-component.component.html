<div class="header-container">
  <img src="../../../assets/nearby.png" class="header-icon" />
</div>

<ion-searchbar
  [(ngModel)]="searchQuery"
  (ionInput)="filterResults($event)"
  placeholder="Search by Title"
  style="--background: #ffffff; --color: #000000;">
</ion-searchbar>

<ion-refresher slot="fixed" (ionRefresh)="refreshList($event)">
  <ion-refresher-content></ion-refresher-content>
</ion-refresher>

<div class="list-scroll">
  <ion-list>
    <ion-item *ngFor="let anadanama of filteredList" button (click)="openDetails(anadanama)">
      <ion-thumbnail slot="start">
        <img [src]="'https://www.ayyappatelugu.com/public/assets/annadhanam_images/' + anadanama.image" />
      </ion-thumbnail>

      <ion-label class="ion-text-wrap" style="color: #fff;">
        <h4>{{ anadanama._title }}</h4>
        <p class="distance-text" *ngIf="anadanama._distance">{{ anadanama._distance }}</p>
      </ion-label>

      <div slot="end" class="direction-btn" *ngIf="anadanama._hasCoords"
           (click)="startNavigation($event, anadanama)">
        <ion-icon name="navigate-circle-outline"></ion-icon>
        <span>Direction</span>
      </div>
    </ion-item>
  </ion-list>

  <div class="list-bottom-space"></div>
</div>
