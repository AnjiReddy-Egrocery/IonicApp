<ion-content fullscreen class="login-page">
  <div class="login-container">

     <div class="card-wrapper">
        <div class="profile-image">
        <ion-img src="../../../assets/ic_launcher.png"></ion-img>
      </div>

      <div class="header-card">
        <h1 class="title" style="margin-top: 50px;">Forgot Password</h1>
      </div>

      <div class="login-card">    
      
        <!-- Email/Mobile -->
        <ion-item class="input-item">
          <ion-icon name="person-outline" slot="start" style="margin-right: 10px;"></ion-icon>
          <ion-input type="email" placeholder=" Email address "  [(ngModel)]="email"
           [ngModelOptions]="{standalone: true}"></ion-input>
        </ion-item>

     

        <!-- Login Button -->
        <ion-button expand="block" color="danger"  type="button" class="login-btn" (click)="goToCtreatePassword()">
          Create Password
        </ion-button>

        <!-- Forgot password -->
      
     
      </div>
     </div>  
  </div>
</ion-content>
